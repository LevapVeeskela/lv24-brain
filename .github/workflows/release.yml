name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release artifacts
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --skip=publish -f deploy/goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble release assets and manifest
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          mkdir -p release-assets
          find dist -type f | while read -r file; do
            base="$(basename "$file")"
            case "$base" in
              brain_*|brain-server_*|checksums.txt) cp "$file" "release-assets/$base" ;;
            esac
          done
          cp dist/checksums.txt release-assets/checksums.txt
          python3 - <<'PY'
          import json, os, re
          from datetime import datetime, timezone

          tag = os.environ["TAG"]
          version = tag[1:] if tag.startswith("v") else tag
          repo = os.environ["REPOSITORY"]
          channel = "beta" if "-" in version else "stable"

          sums = {}
          with open("release-assets/checksums.txt", encoding="utf-8") as handle:
              for line in handle:
                  parts = line.split()
                  if len(parts) >= 2 and re.fullmatch(r"[0-9a-fA-F]{64}", parts[0]):
                      sums[parts[-1].lstrip("*")] = parts[0].lower()

          pattern = re.compile(
              r"^(brain|brain-server)_(.+?)_(windows|linux|darwin)_(amd64|arm64)(\.exe)?$"
          )
          assets = []
          for name, digest in sorted(sums.items()):
              match = pattern.match(name)
              if not match:
                  continue
              kind, _, goos, goarch, _ = match.groups()
              assets.append({
                  "kind": "cli" if kind == "brain" else "server",
                  "os": goos,
                  "arch": goarch,
                  "name": name,
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{name}",
                  "sha256": digest,
              })

          if not assets:
              raise SystemExit("no brain release assets found in checksums.txt")

          # Every manifest asset must be a file that is about to be uploaded,
          # and every uploaded binary must be in the manifest (v0.1.1 shipped
          # .exe.exe files while the manifest pointed at .exe).
          files = set(os.listdir("release-assets"))
          named = {asset["name"] for asset in assets}
          missing = sorted(name for name in named if name not in files)
          stray = sorted(f for f in files if re.match(r"^(brain|brain-server)_", f) and f not in named)
          if missing or stray:
              raise SystemExit(f"release assets do not match the manifest: missing={missing} unreferenced={stray}")

          manifest = {
              "version": version,
              "channel": channel,
              "min_schema_version": 1,
              "published_at": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "assets": assets,
          }
          with open("release-assets/release.json", "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY
          ls -l release-assets

      # The signing seed is exposed to this step only. `sign` refuses keys
      # that are not embedded in internal/update/signature.go, so a release
      # can never be published with a signature installed binaries reject.
      - name: Sign release manifest
        env:
          BRAIN_RELEASE_SIGNING_KEY: ${{ secrets.BRAIN_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${BRAIN_RELEASE_SIGNING_KEY}" ]; then
            echo "BRAIN_RELEASE_SIGNING_KEY secret is not set; refusing to publish an unsigned release" >&2
            exit 1
          fi
          go run ./internal/tools/releasesign sign \
            -in release-assets/release.json \
            -out release-assets/release.json.sig
          go run ./internal/tools/releasesign verify \
            -in release-assets/release.json \
            -sig release-assets/release.json.sig

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prerelease_args=()
          case "$TAG" in
            *-*) prerelease_args=(--prerelease) ;;
          esac
          # Releases are immutable: never replace assets of an existing tag;
          # cut a new tag instead.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; refusing to overwrite its assets" >&2
            exit 1
          fi
          gh release create "$TAG" release-assets/* \
            --title "$TAG" \
            --generate-notes \
            "${prerelease_args[@]}"

  # npm and the server image run as separate jobs after the GitHub release
  # exists, so a failure in one never blocks the other. Both are also
  # runnable by hand for an existing tag (npm-publish.yml, image.yml).
  npm:
    needs: release
    permissions:
      contents: read
      # npm Trusted Publishing (OIDC) and provenance. npm validates the
      # calling workflow, release.yml, against each package's trusted publishers.
      id-token: write
    uses: ./.github/workflows/npm-publish.yml
    with:
      tag: ${{ github.ref_name }}

  image:
    needs: release
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      tag: ${{ github.ref_name }}
      latest: true
