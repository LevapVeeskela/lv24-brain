name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release artifacts
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --skip=publish -f deploy/goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble release assets and manifest
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          mkdir -p release-assets
          find dist -type f | while read -r file; do
            base="$(basename "$file")"
            case "$base" in
              brain_*|brain-server_*|checksums.txt) cp "$file" "release-assets/$base" ;;
            esac
          done
          cp dist/checksums.txt release-assets/checksums.txt
          python3 - <<'PY'
          import json, os, re
          from datetime import datetime, timezone

          tag = os.environ["TAG"]
          version = tag[1:] if tag.startswith("v") else tag
          repo = os.environ["REPOSITORY"]
          channel = "beta" if "-" in version else "stable"

          sums = {}
          with open("release-assets/checksums.txt", encoding="utf-8") as handle:
              for line in handle:
                  parts = line.split()
                  if len(parts) >= 2 and re.fullmatch(r"[0-9a-fA-F]{64}", parts[0]):
                      sums[parts[-1].lstrip("*")] = parts[0].lower()

          pattern = re.compile(
              r"^(brain|brain-server)_(.+?)_(windows|linux|darwin)_(amd64|arm64)(\.exe)?$"
          )
          assets = []
          for name, digest in sorted(sums.items()):
              match = pattern.match(name)
              if not match:
                  continue
              kind, _, goos, goarch, _ = match.groups()
              assets.append({
                  "kind": "cli" if kind == "brain" else "server",
                  "os": goos,
                  "arch": goarch,
                  "name": name,
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{name}",
                  "sha256": digest,
              })

          if not assets:
              raise SystemExit("no brain release assets found in checksums.txt")

          manifest = {
              "version": version,
              "channel": channel,
              "min_schema_version": 1,
              "published_at": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "assets": assets,
          }
          with open("release-assets/release.json", "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY
          ls -l release-assets

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prerelease_args=()
          case "$TAG" in
            *-*) prerelease_args=(--prerelease) ;;
          esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "$TAG" \
              --generate-notes \
              "${prerelease_args[@]}"
          fi
