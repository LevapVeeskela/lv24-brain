name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      # OIDC for npm Trusted Publishing and provenance in the steps below.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release artifacts
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --skip=publish -f deploy/goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble release assets and manifest
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          mkdir -p release-assets
          find dist -type f | while read -r file; do
            base="$(basename "$file")"
            case "$base" in
              brain_*|brain-server_*|checksums.txt) cp "$file" "release-assets/$base" ;;
            esac
          done
          cp dist/checksums.txt release-assets/checksums.txt
          python3 - <<'PY'
          import json, os, re
          from datetime import datetime, timezone

          tag = os.environ["TAG"]
          version = tag[1:] if tag.startswith("v") else tag
          repo = os.environ["REPOSITORY"]
          channel = "beta" if "-" in version else "stable"

          sums = {}
          with open("release-assets/checksums.txt", encoding="utf-8") as handle:
              for line in handle:
                  parts = line.split()
                  if len(parts) >= 2 and re.fullmatch(r"[0-9a-fA-F]{64}", parts[0]):
                      sums[parts[-1].lstrip("*")] = parts[0].lower()

          pattern = re.compile(
              r"^(brain|brain-server)_(.+?)_(windows|linux|darwin)_(amd64|arm64)(\.exe)?$"
          )
          assets = []
          for name, digest in sorted(sums.items()):
              match = pattern.match(name)
              if not match:
                  continue
              kind, _, goos, goarch, _ = match.groups()
              assets.append({
                  "kind": "cli" if kind == "brain" else "server",
                  "os": goos,
                  "arch": goarch,
                  "name": name,
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{name}",
                  "sha256": digest,
              })

          if not assets:
              raise SystemExit("no brain release assets found in checksums.txt")

          # Every manifest asset must be a file that is about to be uploaded,
          # and every uploaded binary must be in the manifest (v0.1.1 shipped
          # .exe.exe files while the manifest pointed at .exe).
          files = set(os.listdir("release-assets"))
          named = {asset["name"] for asset in assets}
          missing = sorted(name for name in named if name not in files)
          stray = sorted(f for f in files if re.match(r"^(brain|brain-server)_", f) and f not in named)
          if missing or stray:
              raise SystemExit(f"release assets do not match the manifest: missing={missing} unreferenced={stray}")

          manifest = {
              "version": version,
              "channel": channel,
              "min_schema_version": 1,
              "published_at": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "assets": assets,
          }
          with open("release-assets/release.json", "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY
          ls -l release-assets

      # The signing seed is exposed to this step only. `sign` refuses keys
      # that are not embedded in internal/update/signature.go, so a release
      # can never be published with a signature installed binaries reject.
      - name: Sign release manifest
        env:
          BRAIN_RELEASE_SIGNING_KEY: ${{ secrets.BRAIN_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${BRAIN_RELEASE_SIGNING_KEY}" ]; then
            echo "BRAIN_RELEASE_SIGNING_KEY secret is not set; refusing to publish an unsigned release" >&2
            exit 1
          fi
          go run ./internal/tools/releasesign sign \
            -in release-assets/release.json \
            -out release-assets/release.json.sig
          go run ./internal/tools/releasesign verify \
            -in release-assets/release.json \
            -sig release-assets/release.json.sig

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prerelease_args=()
          case "$TAG" in
            *-*) prerelease_args=(--prerelease) ;;
          esac
          # Releases are immutable: never replace assets of an existing tag;
          # cut a new tag instead.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; refusing to overwrite its assets" >&2
            exit 1
          fi
          gh release create "$TAG" release-assets/* \
            --title "$TAG" \
            --generate-notes \
            "${prerelease_args[@]}"

      # npm packages are built only from the verified, signed release assets
      # above. Platform packages are published before the main launcher, and
      # a version that already exists on npm is skipped, so a re-run is safe.
      - name: Build npm packages
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          node npm/build.mjs --version "$VERSION" --dist release-assets --out npm-out

      - name: Set up Node for npm publish
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      # npm Trusted Publishing: the job's OIDC token (id-token: write) is the
      # only credential; each package trusts release.yml and npm-publish.yml.
      - name: Publish npm packages
        env:
          TAG: ${{ github.ref_name }}
        run: bash npm/publish.sh "${TAG#v}" npm-out

  # Server image for team mode, built only after the release above succeeded.
  # Public GHCR packages have free storage and bandwidth; the account's
  # Packages budget is $0 with usage blocked. The build stage cross-compiles,
  # so QEMU only runs the arm64 `apk add` of the runtime stage.
  image:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # vX.Y.Z -> X.Y.Z and X.Y; stable tags also move `latest`.
      # Prereleases (vX.Y.Z-rc.1) get only their exact version.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/levapveeskela/lv24-brain-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build metadata
        id: build
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "date=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.build.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.build.outputs.date }}
