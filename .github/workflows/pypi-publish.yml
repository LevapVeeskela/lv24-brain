name: pypi-publish

# Publishes the lv24-brain Python launcher to PyPI with Trusted Publishing
# (OIDC): no API token, no password, no PyPI secret. PyPI validates the calling
# GitHub workflow against the project's trusted publisher and issues a
# short-lived upload credential.
#
# Triggers:
#   - publishing a GitHub release (tag vX.Y.Z) publishes that version;
#   - manual dispatch with an explicit version (must match the tag, pyproject
#     and __init__.py).
#
# Note: release.yml creates GitHub releases with the repository GITHUB_TOKEN,
# and GitHub does not start workflows from events caused by that token. For a
# release created by release.yml, run this workflow manually with the version
# (or publish the release from the GitHub UI). docs/pypi.md has the runbook.
#
# If the version already exists on PyPI, the publish step is skipped.
# Free for a public repository; no paid runners or services are used.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must equal the release tag, python/pyproject.toml and __init__.py, e.g. 0.12.0)"
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: pypi-publish-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Compile and test the launcher
        working-directory: python
        run: |
          set -euo pipefail
          python -m compileall -q src tests
          python -m unittest discover -s tests -v

      - name: Resolve and validate version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import tomllib
          from pathlib import Path

          raw = (os.environ.get("RELEASE_TAG") or os.environ.get("INPUT_VERSION") or "").strip()
          version = raw[1:] if raw.startswith("v") else raw

          if not version:
              raise SystemExit("::error::No version provided (release tag or workflow input).")

          if not re.fullmatch(r"\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?", version):
              raise SystemExit(f"::error::Invalid version '{version}'.")

          try:
              with Path("python/pyproject.toml").open("rb") as handle:
                  pyproject = tomllib.load(handle)
              project = pyproject["project"]
              pyproject_version = project["version"]
              project_name = project["name"]
          except (OSError, KeyError, tomllib.TOMLDecodeError) as error:
              raise SystemExit(f"::error::Could not read python/pyproject.toml: {error}")

          if project_name != "lv24-brain":
              raise SystemExit(f"::error::Unexpected project name '{project_name}' in python/pyproject.toml.")

          try:
              init_text = Path("python/src/lv24_brain/__init__.py").read_text(encoding="utf-8")
          except OSError as error:
              raise SystemExit(f"::error::Could not read python __init__.py: {error}")
          match = re.search(r'^__version__[ ]*=[ ]*"([^"]+)"', init_text, re.MULTILINE)
          if not match:
              raise SystemExit("::error::Could not find __version__ in python/src/lv24_brain/__init__.py")
          init_version = match.group(1)

          checked = [
              ("python/pyproject.toml", pyproject_version),
              ("python/src/lv24_brain/__init__.py", init_version),
          ]

          # This repository has no root package.json: npm/build.mjs generates
          # the npm manifests from the tag at release time. Keep the check for
          # a future layout, but do not fail when the file is absent.
          package_json = Path("package.json")
          if package_json.exists():
              try:
                  package_version = json.loads(package_json.read_text(encoding="utf-8"))["version"]
              except (OSError, KeyError, ValueError) as error:
                  raise SystemExit(f"::error::Could not read package.json version: {error}")
              checked.append(("package.json", package_version))
          else:
              print("::notice::No root package.json; the release tag is the npm/Go version source of truth.")

          for path, found in checked:
              if found != version:
                  raise SystemExit(f"::error::Version '{version}' does not match {path} '{found}'.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"version={version}\n")

          print(f"Resolved version: {version}")
          PY

      - name: Build sdist and wheel
        working-directory: python
        run: python -m build

      - name: Validate distribution metadata
        working-directory: python
        run: python -m twine check dist/*

      - name: Check whether the version is already published
        id: check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          version = os.environ["VERSION"]
          quoted = urllib.parse.quote(version, safe="")
          url = f"https://pypi.org/pypi/lv24-brain/{quoted}/json"
          request = urllib.request.Request(url, headers={"User-Agent": "lv24-brain-pypi-publish"})

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  status = response.status
          except urllib.error.HTTPError as error:
              status = error.code

          if status == 200:
              print(f"::notice::lv24-brain {version} is already on PyPI; skipping publish.")
              skip = "true"
          elif status == 404:
              print(f"lv24-brain {version} is not on PyPI yet; publishing.")
              skip = "false"
          else:
              raise SystemExit(f"::error::Unexpected PyPI response status: {status}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"skip={skip}\n")
          PY

      # Trusted Publishing: the action exchanges the GitHub OIDC token for a
      # short-lived PyPI upload credential. No password or API token is set.
      - name: Publish to PyPI
        if: steps.check.outputs.skip != 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: python/dist/
