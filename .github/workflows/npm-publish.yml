name: npm-publish

# Publishes the npm packages for an existing GitHub release. Called by
# release.yml after each tag release, and runnable by hand to re-publish a tag
# (for example after a failed publish). Uses the
# signed release assets: the manifest signature and every binary checksum are
# verified before anything is published. Versions already on npm are skipped.

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag, e.g. v0.8.0"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.8.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          case "$TAG" in v[0-9]*) ;; *) echo "tag must look like v1.2.3"; exit 1 ;; esac
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets

      - name: Verify the signed manifest
        run: |
          go run ./internal/tools/releasesign verify \
            -in release-assets/release.json -sig release-assets/release.json.sig

      - name: Build npm packages
        env:
          TAG: ${{ inputs.tag }}
        run: node npm/build.mjs --version "${TAG#v}" --dist release-assets --out npm-out

      - name: Set up Node for npm publish
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # No registry-url: it writes an .npmrc with a placeholder
          # NODE_AUTH_TOKEN that npm would send instead of using OIDC.
          node-version: "24"

      # npm Trusted Publishing: the job's OIDC token (id-token: write) is the
      # only credential; each package trusts release.yml and npm-publish.yml.
      - name: Publish npm packages
        env:
          TAG: ${{ inputs.tag }}
        run: bash npm/publish.sh "${TAG#v}" npm-out
