name: image

# Builds and pushes the brain-server image (linux/amd64, linux/arm64) to
# ghcr.io/levapveeskela/lv24-brain-server for a release tag. Called by
# release.yml after the GitHub release exists, and runnable by hand to rebuild
# a tag whose image is missing. Public GHCR packages have free storage and
# bandwidth; the account's Packages budget is $0 with usage blocked. The build
# stage cross-compiles, so QEMU only runs the arm64 `apk add` of the runtime.

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag, e.g. v0.8.0"
        required: true
        type: string
      latest:
        description: "Also move the `latest` tag (stable releases only)"
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.8.0"
        required: true
        type: string
      latest:
        description: "Also move the `latest` tag (only for the newest stable release)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: image-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validate tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "tag must look like v1.2.3"; exit 1 ;; esac

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # vX.Y.Z -> X.Y.Z and X.Y; `latest` only when asked and not a prerelease.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/levapveeskela/lv24-brain-server
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
            type=raw,value=latest,enable=${{ inputs.latest && !contains(inputs.tag, '-') }}

      - name: Build metadata
        id: build
        env:
          TAG: ${{ inputs.tag }}
        run: |
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.build.outputs.version }}
            COMMIT=${{ steps.build.outputs.commit }}
            DATE=${{ steps.build.outputs.date }}
